[pytest]
# Limit collection to this repo's own tests. hermit_stock/ and
# microtaiex-daytrade/ are self-contained sub-projects with their own
# pyproject.toml and their own dependencies, which the main venv does not
# install -- collecting them aborts the whole run with import errors before
# a single test executes. Run those from inside their own directories.
testpaths = tests

# A test that returns instead of asserting is almost always a script that was
# never converted; pytest counts the return value as a pass. Make it an error.
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning

markers =
    needs_db: requires a reachable PostgreSQL instance
    needs_network: requires outbound network or third-party credentials
